<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi (coding-agent) — Logo 设计方案探索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #FAFAFA;
            color: #1A1A1A;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        /* Subtle grain texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* Smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* Logo hover effects */
        .logo-card {
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover {
            transform: translateY(-4px);
        }

        .logo-canvas {
            position: relative;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Aura effect on hover */
        .logo-aura {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0.5);
            opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px);
            pointer-events: none;
        }

        .logo-card:hover .logo-aura {
            transform: scale(1);
            opacity: 1;
        }

        /* Divider animation */
        .divider-line {
            width: 0;
            height: 1px;
            background: #1A1A1A;
            opacity: 0.2;
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover .divider-line {
            width: 100%;
        }

        /* Showcase image effects */
        .showcase-img {
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            border-radius: 8px;
            overflow: hidden;
        }

        .showcase-img:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
        }

        /* Typography refinements */
        .tracking-ultra-wide {
            letter-spacing: 0.2em;
        }

        .text-balance {
            text-wrap: balance;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Logo1 = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M30 35H70" />
                    <path d="M42 35V65" />
                    <path d="M58 35V65Q58 75 68 75" />
                </g>
                <circle cx="42" cy="70" r="3" fill="currentColor" />
            </svg>
        );

        const Logo2 = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g fill="currentColor">
                    <rect x="25" y="25" width="8" height="8" rx="2" />
                    <rect x="37" y="25" width="8" height="8" rx="2" />
                    <rect x="49" y="25" width="8" height="8" rx="2" />
                    <rect x="61" y="25" width="8" height="8" rx="2" />
                    <rect x="25" y="37" width="8" height="8" rx="2" />
                    <rect x="37" y="37" width="8" height="8" rx="2" />
                    <rect x="25" y="49" width="8" height="8" rx="2" />
                    <rect x="37" y="49" width="8" height="8" rx="2" />
                    <rect x="49" y="49" width="8" height="8" rx="2" />
                    <rect x="61" y="49" width="8" height="8" rx="2" />
                    <rect x="25" y="61" width="8" height="8" rx="2" />
                    <rect x="37" y="61" width="8" height="8" rx="2" />
                    <rect x="49" y="61" width="8" height="8" rx="2" />
                    <rect x="61" y="61" width="8" height="8" rx="2" />
                </g>
            </svg>
        );

        const Logo3 = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="circle-mask-3">
                        <circle cx="50" cy="50" r="35" />
                    </clipPath>
                </defs>
                <circle cx="50" cy="50" r="38" stroke="currentColor" strokeWidth="1" strokeDasharray="2 4" />
                <g clipPath="url(#circle-mask-3)" stroke="currentColor" strokeLinecap="round">
                    <line x1="15" y1="30" x2="85" y2="30" strokeWidth="2" />
                    <line x1="15" y1="40" x2="85" y2="40" strokeWidth="3" />
                    <line x1="15" y1="50" x2="85" y2="50" strokeWidth="4" />
                    <line x1="15" y1="60" x2="85" y2="60" strokeWidth="3" />
                    <line x1="15" y1="70" x2="85" y2="70" strokeWidth="2" />
                </g>
            </svg>
        );

        const Logo4 = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,40 58.6,45 58.6,55 50,60 41.4,55 41.4,45" fill="currentColor" />
                <g fill="currentColor">
                    <circle cx="50" cy="25" r="2.5" />
                    <circle cx="75" cy="50" r="2.5" />
                    <circle cx="50" cy="75" r="2.5" />
                    <circle cx="25" cy="50" r="2.5" />
                    <circle cx="68" cy="32" r="1.5" opacity="0.4" />
                    <circle cx="68" cy="68" r="1.5" opacity="0.4" />
                    <circle cx="32" cy="68" r="1.5" opacity="0.4" />
                    <circle cx="32" cy="32" r="1.5" opacity="0.4" />
                </g>
                <g stroke="currentColor" strokeWidth="1" opacity="0.2">
                    <line x1="50" y1="40" x2="50" y2="25" />
                    <line x1="58.6" y1="50" x2="75" y2="50" />
                    <line x1="50" y1="60" x2="50" y2="75" />
                    <line x1="41.4" y1="50" x2="25" y2="50" />
                </g>
            </svg>
        );

        const Logo5 = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M35 30H25V70H35" />
                    <path d="M65 30H75V70H65" />
                </g>
                <rect x="42" y="62" width="16" height="4" fill="currentColor" />
            </svg>
        );

        const Logo6 = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g fill="currentColor">
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(0, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(45, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(90, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(135, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(180, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(225, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(270, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(315, 50, 50)" />
                    <rect x="46" y="42" width="8" height="16" rx="4" />
                </g>
            </svg>
        );

        const LogoShowcase = () => {
            const logos = [
                {
                    Component: Logo1,
                    title: "核心 Pi",
                    subtitle: "几何极简主义",
                    philosophy: "希腊字母 π 的现代抽象化设计，由三条核心笔画构成。结构上平衡了“支架（harness）”的稳固感与产品名称的数学精密感。"
                },
                {
                    Component: Logo2,
                    title: "二进制指令",
                    subtitle: "模块化点阵",
                    philosophy: "利用圆角矩形点阵表现扩展系统的模块化特性。通过对特定元素的删除形成视觉上的“提示符”，将设计扎根于终端文化中。"
                },
                {
                    Component: Logo3,
                    title: "流动智能",
                    subtitle: "线性数据系统",
                    philosophy: "粗细不一的平行线代表代码和数据在终端中的持续流动。圆形边界象征着一个受控、安全的“支架”环境。"
                },
                {
                    Component: Logo4,
                    title: "系统原点",
                    subtitle: "结构化网络",
                    philosophy: "几何六边形核心代表引擎高效、结构化的基础。放射状的节点象征着连接到这一稳定原点的庞大扩展生态系统。"
                },
                {
                    Component: Logo5,
                    title: "语法壳",
                    subtitle: "终端原生",
                    philosophy: "使用粗体括号将“支架”表现为一种保护壳。中心的下划线光标代表创作的起点以及工具的 CLI 原生属性。"
                },
                {
                    Component: Logo6,
                    title: "胶囊支架",
                    subtitle: "模块化径向矩阵",
                    philosophy: "对支架概念的进阶诠释。一圈精密排列的胶囊环绕着中心核心，代表一个为高性能终端操作而生的模块化、韧性系统。"
                }
            ];

            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6">

                    {/* Header */}
                    <div className="text-center mb-20 max-w-3xl">
                        <h1 className="text-6xl md:text-7xl font-extralight tracking-wider mb-6 uppercase">
                            Pi (coding-agent)
                        </h1>
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-8">
                            极简终端编程支架 (Minimal terminal coding harness)
                        </p>
                        <div className="w-12 h-[1px] bg-[#1A1A1A] mx-auto opacity-30"></div>
                    </div>

                    {/* Logo Grid */}
                    <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 mb-32">
                        {logos.map((logo, index) => (
                            <div key={index} className="flex flex-col items-center logo-card cursor-pointer">

                                {/* Logo Canvas */}
                                <div className="w-64 h-64 mb-10 flex items-center justify-center relative">
                                    <div className="logo-aura"></div>
                                    <div className="w-32 h-32 relative z-10 logo-canvas">
                                        <logo.Component />
                                    </div>
                                </div>

                                {/* Text Description */}
                                <div className="text-center w-full px-4">
                                    <h2 className="text-xl font-medium tracking-wider mb-2 uppercase">
                                        {logo.title}
                                    </h2>
                                    <h3 className="text-xs font-mono opacity-50 tracking-widest mb-6">
                                        {logo.subtitle}
                                    </h3>
                                    <p className="text-sm leading-relaxed opacity-70 text-center font-light text-balance">
                                        {logo.philosophy}
                                    </p>
                                </div>

                                {/* Bottom Divider */}
                                <div className="divider-line mt-8 mx-auto"></div>
                            </div>
                        ))}
                    </div>

                    {/* Footer */}
                    <div className="mt-32 max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">
                            由 Logo Generator 生成<br/>
                            2026
                        </p>
                    </div>

                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>

</body>
</html>
