<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi (coding-agent) — 品牌视觉最终展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
            position: relative;
        }
        
        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
        }

        .showcase-card {
            background: #0A0A0A;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .showcase-card:hover {
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-5px);
        }

        .image-container {
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #111;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .showcase-card:hover .image-container img {
            transform: scale(1.05);
        }

        .micro-tag {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.4;
            font-family: 'JetBrains Mono', monospace;
        }

        .pi-logo-svg {
            width: 40px;
            height: 40px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div id="root"></div>

    <script type="text/babel">
        const Logo1 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="pi-logo-svg" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M30 35H70" />
                    <path d="M42 35V65" />
                    <path d="M58 35V65Q58 75 68 75" />
                </g>
                <circle cx="42" cy="70" r="3" fill="currentColor" />
            </svg>
        );

        const Logo2 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="pi-logo-svg" xmlns="http://www.w3.org/2000/svg">
                <g fill="currentColor">
                    <rect x="25" y="25" width="8" height="8" rx="2" />
                    <rect x="37" y="25" width="8" height="8" rx="2" />
                    <rect x="49" y="25" width="8" height="8" rx="2" />
                    <rect x="61" y="25" width="8" height="8" rx="2" />
                    <rect x="25" y="37" width="8" height="8" rx="2" />
                    <rect x="37" y="37" width="8" height="8" rx="2" />
                    <rect x="25" y="49" width="8" height="8" rx="2" />
                    <rect x="37" y="49" width="8" height="8" rx="2" />
                    <rect x="49" y="49" width="8" height="8" rx="2" />
                    <rect x="61" y="49" width="8" height="8" rx="2" />
                    <rect x="25" y="61" width="8" height="8" rx="2" />
                    <rect x="37" y="61" width="8" height="8" rx="2" />
                    <rect x="49" y="61" width="8" height="8" rx="2" />
                    <rect x="61" y="61" width="8" height="8" rx="2" />
                </g>
            </svg>
        );

        const Logo4 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="pi-logo-svg" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,40 58.6,45 58.6,55 50,60 41.4,55 41.4,45" fill="currentColor" />
                <g fill="currentColor">
                    <circle cx="50" cy="25" r="2.5" />
                    <circle cx="75" cy="50" r="2.5" />
                    <circle cx="50" cy="75" r="2.5" />
                    <circle cx="25" cy="50" r="2.5" />
                </g>
                <g stroke="currentColor" strokeWidth="1" opacity="0.2">
                    <line x1="50" y1="40" x2="50" y2="25" />
                    <line x1="58.6" y1="50" x2="75" y2="50" />
                </g>
            </svg>
        );

        const Logo6 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="pi-logo-svg" xmlns="http://www.w3.org/2000/svg">
                <g fill="currentColor">
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(0, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(90, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(180, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(270, 50, 50)" />
                    <rect x="46" y="42" width="8" height="16" rx="4" />
                </g>
            </svg>
        );

        const FinalPresentation = () => {
            const items = [
                {
                    Logo: Logo1,
                    name: "核心 Pi",
                    desc: "几何极简主义",
                    style: "THE VOID (绝对虚空)",
                    img: "../output/Core Pi_void.png"
                },
                {
                    Logo: Logo4,
                    name: "系统原点",
                    desc: "结构化网络",
                    style: "LED MATRIX (数字硬件)",
                    img: "../output/System Origin_led_matrix.png"
                },
                {
                    Logo: Logo2,
                    name: "二进制指令",
                    desc: "模块化点阵",
                    style: "CLINICAL STUDIO (无菌影棚)",
                    img: "../output/Binary Prompt_clinical.png"
                }
            ];

            return (
                <div className="pb-32">
                    {/* Hero */}
                    <section className="hero-section text-center">
                        <div className="micro-tag mb-4">Final Brand Identity</div>
                        <h1 className="text-7xl md:text-8xl font-thin tracking-tighter mb-8 uppercase">
                            Pi Agent
                        </h1>
                        <div className="w-px h-32 bg-white opacity-20"></div>
                    </section>

                    {/* Showcase Grid */}
                    <div className="max-w-6xl mx-auto px-6 grid grid-cols-1 gap-24">
                        {items.map((item, i) => (
                            <div key={i} className="showcase-card rounded-2xl overflow-hidden">
                                <div className="image-container">
                                    <img src={item.img} alt={item.name} />
                                </div>
                                <div className="p-8 md:p-12 flex flex-col md:flex-row justify-between items-start md:items-center gap-8">
                                    <div>
                                        <div className="flex items-center gap-4 mb-4">
                                            <item.Logo />
                                            <div>
                                                <h2 className="text-2xl font-light tracking-wide uppercase">{item.name}</h2>
                                                <div className="micro-tag">{item.desc}</div>
                                            </div>
                                        </div>
                                        <p className="text-sm opacity-40 font-mono">Style: {item.style}</p>
                                    </div>
                                    <div className="flex gap-4">
                                        <button className="px-6 py-2 border border-white/10 rounded-full micro-tag hover:bg-white hover:text-black transition-colors">
                                            Download SVG
                                        </button>
                                        <button className="px-6 py-2 border border-white/10 rounded-full micro-tag hover:bg-white hover:text-black transition-colors">
                                            Download 2K PNG
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Footer */}
                    <footer className="mt-48 text-center border-t border-white/5 pt-20">
                        <div className="micro-tag opacity-20 mb-4">Generated by Logo Generator AI</div>
                        <div className="text-xs font-mono opacity-20 uppercase tracking-widest">
                            © 2026 // Pi Coding Agent Identity System
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<FinalPresentation />, document.getElementById('root'));
    </script>
</body>
</html>
