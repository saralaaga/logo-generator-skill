<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi (coding-agent) — WebGL 动态视觉展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            height: 100vh;
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .content-overlay {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }

        .ui-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-container {
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.1));
            pointer-events: auto;
            cursor: pointer;
        }

        .logo-container:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 50px rgba(255,255,255,0.2));
        }

        .micro-tag {
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.5;
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-dots {
            display: flex;
            gap: 1rem;
            pointer-events: auto;
        }

        .nav-dot {
            width: 40px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .nav-dot.active {
            background: rgba(255,255,255,1);
            width: 60px;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            color: #fff;
        }

        .fade-in {
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="glcanvas"></canvas>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Logo1 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="logo-svg" xmlns="http://www.w3.org/2000/svg">
                <g stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M30 35H70" />
                    <path d="M42 35V65" />
                    <path d="M58 35V65Q58 75 68 75" />
                </g>
                <circle cx="42" cy="70" r="2" fill="currentColor" />
            </svg>
        );

        const Logo2 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="logo-svg" xmlns="http://www.w3.org/2000/svg">
                <g fill="currentColor">
                    <rect x="25" y="25" width="8" height="8" rx="2" />
                    <rect x="37" y="25" width="8" height="8" rx="2" />
                    <rect x="49" y="25" width="8" height="8" rx="2" />
                    <rect x="61" y="25" width="8" height="8" rx="2" />
                    <rect x="25" y="37" width="8" height="8" rx="2" />
                    <rect x="37" y="37" width="8" height="8" rx="2" />
                    <rect x="25" y="49" width="8" height="8" rx="2" />
                    <rect x="37" y="49" width="8" height="8" rx="2" />
                    <rect x="49" y="49" width="8" height="8" rx="2" />
                    <rect x="61" y="49" width="8" height="8" rx="2" />
                    <rect x="25" y="61" width="8" height="8" rx="2" />
                    <rect x="37" y="61" width="8" height="8" rx="2" />
                    <rect x="49" y="61" width="8" height="8" rx="2" />
                    <rect x="61" y="61" width="8" height="8" rx="2" />
                </g>
            </svg>
        );

        const Logo4 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="logo-svg" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,40 58.6,45 58.6,55 50,60 41.4,55 41.4,45" fill="currentColor" />
                <g fill="currentColor">
                    <circle cx="50" cy="25" r="2.5" />
                    <circle cx="75" cy="50" r="2.5" />
                    <circle cx="50" cy="75" r="2.5" />
                    <circle cx="25" cy="50" r="2.5" />
                </g>
                <g stroke="currentColor" strokeWidth="1" opacity="0.4">
                    <line x1="50" y1="40" x2="50" y2="25" />
                    <line x1="58.6" y1="50" x2="75" y2="50" />
                    <line x1="50" y1="60" x2="50" y2="75" />
                    <line x1="41.4" y1="50" x2="25" y2="50" />
                </g>
            </svg>
        );

        const Logo6 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="logo-svg" xmlns="http://www.w3.org/2000/svg">
                <g fill="currentColor">
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(0, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(90, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(180, 50, 50)" />
                    <rect x="47" y="18" width="6" height="14" rx="3" transform="rotate(270, 50, 50)" />
                    <rect x="46" y="42" width="8" height="16" rx="4" />
                </g>
            </svg>
        );

        const WebGLPresentation = () => {
            const [index, setIndex] = useState(0);
            const items = [
                { Component: Logo1, name: "核心 Pi", desc: "几何极简主义" },
                { Component: Logo4, name: "系统原点", desc: "结构化网络" },
                { Component: Logo2, name: "二进制指令", desc: "模块化点阵" },
                { Component: Logo6, name: "胶囊支架", desc: "模块化径向矩阵" }
            ];

            const ActiveLogo = items[index].Component;

            return (
                <div className="h-full">
                    <div className="ui-layer">
                        <div className="flex justify-between items-start">
                            <div className="micro-tag">Pi Agent / Identity V1</div>
                            <div className="text-right">
                                <div className="micro-tag mb-1">Status</div>
                                <div className="text-[10px] font-mono opacity-80 uppercase">System Active // 2026</div>
                            </div>
                        </div>

                        <div className="flex justify-between items-end">
                            <div>
                                <h2 className="text-4xl font-extralight tracking-widest uppercase mb-2">{items[index].name}</h2>
                                <div className="micro-tag">{items[index].desc}</div>
                            </div>
                            <div className="nav-dots">
                                {items.map((_, i) => (
                                    <div 
                                        key={i} 
                                        className={`nav-dot ${i === index ? 'active' : ''}`}
                                        onClick={() => setIndex(i)}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="content-overlay">
                        <div className="logo-container" onClick={() => setIndex((index + 1) % items.length)}>
                            <ActiveLogo key={index} />
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<WebGLPresentation />, document.getElementById('root'));

        // Simple WebGL Background Animation
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl');

        if (gl) {
            let width, height;
            const resize = () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                gl.viewport(0, 0, width, height);
            };
            window.addEventListener('resize', resize);
            resize();

            const vsSource = `
                attribute vec2 position;
                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `;

            const fsSource = `
                precision highp float;
                uniform float time;
                uniform vec2 resolution;

                void main() {
                    vec2 uv = gl_FragCoord.xy / resolution.xy;
                    float d = length(uv - 0.5);
                    vec3 col = vec3(0.02, 0.05, 0.1) * (1.0 - d);
                    
                    // Add some moving noise/particles
                    float n = sin(uv.x * 20.0 + time) * cos(uv.y * 20.0 + time);
                    col += vec3(0.1, 0.15, 0.2) * n * 0.1;
                    
                    gl_FragColor = vec4(col, 1.0);
                }
            `;

            const createShader = (gl, type, source) => {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                return shader;
            };

            const program = gl.createProgram();
            gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
            gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
            gl.linkProgram(program);
            gl.useProgram(program);

            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

            const pos = gl.getAttribLocation(program, 'position');
            gl.enableVertexAttribArray(pos);
            gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

            const timeLoc = gl.getUniformLocation(program, 'time');
            const resLoc = gl.getUniformLocation(program, 'resolution');

            const render = (t) => {
                gl.uniform1f(timeLoc, t * 0.001);
                gl.uniform2f(resLoc, width, height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            };
            requestAnimationFrame(render);
        }
    </script>
</body>
</html>
