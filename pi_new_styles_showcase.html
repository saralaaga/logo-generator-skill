<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Logo - New Styles Showcase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 40px 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-weight: 300;
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 0.1em;
        }
        .subtitle {
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 60px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 40px;
        }
        .card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .label {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.8;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 4px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pi Logo — Background Styles Showcase</h1>
        <div class="subtitle">8 Professional Styles</div>

        <div class="grid">
            <!-- First batch: 4 original styles (from parent output folder) -->
            <div class="card">
                <img src="../output/pi_void.png" alt="The Void">
                <div class="label">The Void — Absolute Black</div>
            </div>

            <div class="card">
                <img src="../output/pi_frosted.png" alt="Frosted Horizon">
                <div class="label">Frosted Horizon — Titanium Gray</div>
            </div>

            <div class="card">
                <img src="../output/pi_fluid.png" alt="Fluid Abyss">
                <div class="label">Fluid Abyss — Deep Purple</div>
            </div>

            <div class="card">
                <img src="../output/pi_iridescent.png" alt="Iridescent Frost">
                <div class="label">Iridescent Frost — Holographic</div>
            </div>

            <!-- New batch: 4 new styles (from logo-generator/output folder) -->
            <div class="card">
                <img src="output/pi_analog_liquid.png" alt="Analog Liquid">
                <div class="label">Analog Liquid — Metallic Shimmer</div>
            </div>

            <div class="card">
                <img src="output/pi_led_matrix.png" alt="LED Matrix">
                <div class="label">LED Matrix — Digital Retro</div>
            </div>

            <div class="card">
                <img src="output/pi_ui_container.png" alt="UI Container">
                <div class="label">UI Container — Product Native</div>
            </div>

            <div class="card">
                <img src="output/pi_swiss_flat.png" alt="Swiss Flat">
                <div class="label">Swiss Flat — Absolute Flatness</div>
            </div>
        </div>
    </div>
</body>
</html>
